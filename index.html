<meta name="theme-color" content="#150c1c">
<style>
:root{--pink:#ff80b0;--pink2:#ffd6e6;--bg:#0b0b0e;--card:#14141a;--line:#26262f;--text:#ececf2;--dim:#8c8c99;--ok:#7be38f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1020 0%,var(--bg) 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:32px 16px 48px;overflow-x:hidden}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:560px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-weight:800;font-size:22px;letter-spacing:.3px}
.brand span{background:linear-gradient(90deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{background:none;border:0;color:var(--dim);font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
.lang button.on{background:var(--pink);color:#1a0a12}
h1{font-size:30px;line-height:1.15;margin-bottom:8px}
.sub{color:var(--dim);font-size:15px;line-height:1.5;margin-bottom:22px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width .4s ease}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;transition:border-color .25s,transform .25s}
.task.done{border-color:rgba(123,227,143,.5)}
.task.run{border-color:var(--pink)}
.row{display:flex;gap:14px;align-items:center}
.num{flex:none;width:38px;height:38px;border-radius:12px;background:#22151d;border:1px solid #3a2230;color:var(--pink);font-weight:800;display:grid;place-items:center;font-size:16px}
.task.done .num{background:rgba(123,227,143,.12);border-color:rgba(123,227,143,.5);color:var(--ok)}
.info{flex:1;min-width:0}
.ttl{font-weight:700;font-size:16px;margin-bottom:3px}
.dsc{color:var(--dim);font-size:13px;line-height:1.4}
.btn{flex:none;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;color:#1a0a12;background:linear-gradient(135deg,var(--pink),var(--pink2));transition:transform .15s,opacity .2s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:#20202a;color:var(--text);border:1px solid var(--line)}
.timer{margin-top:14px;display:none}
.task.run .timer{display:block}
.tbar{height:8px;background:#20202a;border-radius:8px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.tt{font-size:12px;color:var(--dim);margin-top:6px}
.check{display:none;font-weight:800;color:var(--ok);font-size:14px}
.task.done .check{display:block}
.task.done .btn{display:none}
.final{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.final .big{width:100%;padding:14px;font-size:16px}
.keybox{display:none;margin-top:16px}
.keybox.show{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;word-break:break-all;background:#0e0e13;border:1px dashed var(--pink);color:var(--pink2);padding:14px;border-radius:12px;user-select:all}
.kact{display:flex;gap:10px;margin-top:10px}
.kact .btn{flex:1}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:12px}
.exp{font-size:13px;color:var(--ok);margin-top:10px}
.foot{text-align:center;color:#5d5d6a;font-size:12px;margin-top:22px;line-height:1.6}
.err{display:none;margin-top:14px;color:#ff8c8c;font-size:13px;line-height:1.5}
.err.show{display:block}
.prem{margin-top:16px;background:linear-gradient(135deg,rgba(255,128,176,.10),rgba(255,214,230,.05));border:1px solid #4a2a3b;border-radius:16px;padding:18px;text-align:center}
.ptitle{font-weight:800;font-size:16px;color:var(--pink2);margin-bottom:6px}
.pdesc{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:12px}
.pbtn{width:100%}
.hint{font-size:12px;color:var(--dim);margin-top:10px;text-align:center}
@media(max-width:480px){h1{font-size:25px}.row{flex-wrap:wrap}.btn{width:100%}.num{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="petals"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand"><span>sakura</span>.gays</div>
    <div class="lang"><button id="lru" class="on">RU</button><button id="len">EN</button></div>
  </div>
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>
  <div class="bar"><i id="gbar"></i></div>

  <div class="task" id="t1">
    <div class="row">
      <div class="num">1</div>
      <div class="info"><div class="ttl" data-t="t1"></div><div class="dsc" data-t="d1"></div></div>
      <button class="btn" id="b1" data-t="go"></button>
      <div class="check" data-t="done"></div>
    </div>
    <div class="timer"><div class="tbar"><i id="p1"></i></div><div class="tt" id="x1"></div></div>
  </div>

  <div class="task" id="t2">
    <div class="row">
      <div class="num">2</div>
      <div class="info"><div class="ttl" data-t="t2"></div><div class="dsc" data-t="d2"></div></div>
      <button class="btn" id="b2" data-t="go"></button>
      <div class="check" data-t="done"></div>
    </div>
    <div class="timer"><div class="tbar"><i id="p2"></i></div><div class="tt" id="x2"></div></div>
  </div>

  <div class="task" id="t3">
    <div class="row">
      <div class="num">3</div>
      <div class="info"><div class="ttl" data-t="t3"></div><div class="dsc" data-t="d3"></div></div>
      <button class="btn" id="b3" data-t="go"></button>
      <div class="check" data-t="done"></div>
    </div>
    <div class="timer"><div class="tbar"><i id="p3"></i></div><div class="tt" id="x3"></div></div>
  </div>

  <div class="final">
    <button class="btn big" id="getkey" disabled data-t="get"></button>
    <div class="hint" id="hint" data-t="hint"></div>
    <div class="keybox" id="kb">
      <div class="key" id="key"></div>
      <div class="kact">
        <button class="btn" id="copy" data-t="copy"></button>
      </div>
      <div class="exp" data-t="exp"></div><div class="exp" id="left"></div>
      <div class="note" data-t="note"></div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="prem">
    <div class="ptitle" data-t="pt"></div>
    <div class="pdesc" data-t="pd"></div>
    <button class="btn ghost pbtn" id="bp" data-t="pb"></button>
  </div>
  <div class="foot" data-t="foot"></div>
</div>

<script>
(function(){
"use strict";
var LINKS={1:"https://discord.gg/projectreal",2:"https://discord.gg/tcdZaHdP",3:"https://discord.gg/U26tQfnPE"};
var SPONSOR="https://t.me/+6Kr7OQS1Ptg2NGZi";
var WMIN=20,WMAX=30;
var DAYS=1;
var SECRET="4bdeb08783c6c6728a6eeed7";
var LS="sakura_gays_keysys_v2";
var A36="abcdefghijklmnopqrstuvwxyz0123456789";

var I18N={
ru:{h1:"Получи ключ",sub:"Выполни три задания и подожди после каждого от 20 до 30 секунд (время случайное). Ключ генерируется сайтом и действует 1 день.",
t1:"Скачай Real!",d1:"Открой ссылку, подожди проверку задания.",
t2:"Вступи на Discord",d2:"Открой ссылку, подожди проверку задания.",
t3:"Вступи на второй Discord",d3:"Открой ссылку, подожди проверку задания.",
go:"Перейти",done:"Выполнено ✓",get:"Сгенерировать ключ",hint:"Кнопка откроется, когда все три задания будут выполнены.",
wait:"Подожди, задание проверяется… осталось ",sec:" сек",copy:"Скопировать ключ",copied:"Скопировано ✓",
exp:"Ключ действует 1 день с момента генерации.",
note:"Вставь ключ в окно sakura.gays. Через 24 часа ключ перестанет работать, и нужно будет пройти задания заново. Не делись ключом.",
gen:"Генерирую ключ…",left:"Осталось до конца ключа: ",
pt:"Premium-ключ (навсегда)",pd:"Premium-ключи на сайте не выдаются и здесь не показываются. Они не заканчиваются. Жди раздачу в Telegram спонсора.",pb:"Telegram спонсора",
foot:"sakura.gays · key system"},
en:{h1:"Get your key",sub:"Complete three tasks and wait 20 to 30 seconds after each one (random time). The key is generated by the site and lasts 1 day.",
t1:"Download Real!",d1:"Open the link and wait for the task check.",
t2:"Join the Discord",d2:"Open the link and wait for the task check.",
t3:"Join the second Discord",d3:"Open the link and wait for the task check.",
go:"Open",done:"Completed ✓",get:"Generate key",hint:"The button unlocks when all three tasks are completed.",
wait:"Hold on, verifying the task… left: ",sec:" s",copy:"Copy key",copied:"Copied ✓",
exp:"The key lasts 1 day from the moment it is generated.",
note:"Paste the key into the sakura.gays window. After 24 hours it stops working and you will have to complete the tasks again. Do not share it.",
gen:"Generating key…",left:"Key time left: ",
pt:"Premium key (lifetime)",pd:"Premium keys are not issued on this site and are never shown here. They do not expire. Wait for the giveaway in the sponsor's Telegram.",pb:"Sponsor's Telegram",
foot:"sakura.gays · key system"}
};
var lang=(navigator.language||"ru").toLowerCase().indexOf("ru")===0?"ru":"en";
try{var sl=localStorage.getItem("sakura_lang");if(sl)lang=sl}catch(e){}

function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}}

function rnd(n){
  var o="",b=new Uint32Array(n);
  (window.crypto||window.msCrypto).getRandomValues(b);
  for(var i=0;i<n;i++)o+=A36.charAt(b[i]%36);
  return o;
}
function b36(n,len){var s=Math.floor(n).toString(36);while(s.length<len)s="0"+s;return s}
function mac(body){
  var h1=5381,h2=52711,t="ezk1|"+SECRET+"|"+body;
  for(var i=0;i<t.length;i++){var b=t.charCodeAt(i);h1=(h1*131+b)%4294967291;h2=(h2*137+b*7+1)%4294967279}
  return b36(h1%2176782336,6)+b36(h2%1296,2);
}
function genKey(){
  var ts=Math.floor(Date.now()/1000);
  var body=["ez",rnd(1)+b36(ts,6),rnd(8),rnd(4),rnd(5),rnd(8),rnd(6),rnd(4),rnd(5)].join("-");
  var m=mac(body);
  return body+"-"+m.slice(0,6)+"-"+m.slice(6);
}
window.__genKey=genKey;

var st=load();
if(st.issued&&Date.now()-st.issued>DAYS*86400000){st={};save(st)}

function applyLang(){
  var d=I18N[lang];
  document.documentElement.lang=lang;
  var els=document.querySelectorAll("[data-t]");
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute("data-t");if(d[k]!==undefined)els[i].textContent=d[k]}
  $("lru").className=lang==="ru"?"on":"";
  $("len").className=lang==="en"?"on":"";
  try{localStorage.setItem("sakura_lang",lang)}catch(e){}
  render();
}
$("lru").onclick=function(){lang="ru";applyLang()};
$("len").onclick=function(){lang="en";applyLang()};

var ids=[1,2,3];
function dur(n){return (st["w"+n]||WMAX)*1000}
function isDone(n){var t=st["s"+n];return !!t&&Date.now()-t>=dur(n)}
function running(n){var t=st["s"+n];return !!t&&Date.now()-t<dur(n)}
var busy=false;

function render(){
  var d=I18N[lang],doneCount=0;
  for(var i=0;i<ids.length;i++){
    var n=ids[i],el=$("t"+n);
    var done=isDone(n),run=running(n);
    if(done)doneCount++;
    el.className="task"+(done?" done":"")+(run?" run":"");
    $("b"+n).disabled=run;
    if(run){
      var total=dur(n),left=Math.max(0,total-(Date.now()-st["s"+n]));
      $("p"+n).style.width=(100-left/total*100)+"%";
      $("x"+n).textContent=d.wait+Math.ceil(left/1000)+d.sec;
    }
  }
  $("gbar").style.width=(doneCount/ids.length*100)+"%";
  if(!busy)$("getkey").disabled=doneCount<ids.length;
  $("hint").style.display=(doneCount<ids.length&&!st.key)?"block":"none";
  if(st.key)showKey();
}

function showKey(){
  $("key").textContent=st.key;
  $("kb").className="keybox show";
  $("getkey").style.display="none";
  $("hint").style.display="none";
  var left=Math.max(0,DAYS*86400000-(Date.now()-st.issued));
  var h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000);
  $("left").textContent=I18N[lang].left+h+":"+(m<10?"0":"")+m;
}

function start(n){
  if(isDone(n)||running(n))return;
  st["s"+n]=Date.now();
  st["w"+n]=WMIN+Math.floor(Math.random()*(WMAX-WMIN+1));
  save(st);
  window.open(LINKS[n],"_blank","noopener");
  render();
}
$("b1").onclick=function(){start(1)};
$("b2").onclick=function(){start(2)};
$("b3").onclick=function(){start(3)};
$("bp").onclick=function(){window.open(SPONSOR,"_blank","noopener")};

$("getkey").onclick=function(){
  if(!(isDone(1)&&isDone(2)&&isDone(3)))return;
  if(st.key){showKey();return}
  if(busy)return;
  busy=true;
  var gk=$("getkey");gk.disabled=true;gk.textContent=I18N[lang].gen;
  var final=genKey(),kb=$("kb"),ke=$("key"),t0=Date.now(),total=1800;
  kb.className="keybox show";
  var iv=setInterval(function(){
    var p=Math.min(1,(Date.now()-t0)/total),out="";
    for(var i=0;i<final.length;i++){
      var c=final.charAt(i);
      if(c==="-"||i<p*final.length)out+=c;else out+=A36.charAt(Math.floor(Math.random()*36));
    }
    ke.textContent=out;
    if(p>=1){
      clearInterval(iv);
      st.key=final;st.issued=Date.now();save(st);
      busy=false;gk.textContent=I18N[lang].get;
      showKey();
    }
  },45);
};
$("copy").onclick=function(){
  var k=st.key||"",b=$("copy"),d=I18N[lang];
  function ok(){b.textContent=d.copied;setTimeout(function(){b.textContent=I18N[lang].copy},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(k).then(ok,fallback)}else fallback();
  function fallback(){
    var r=document.createRange();r.selectNodeContents($("key"));
    var s=window.getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand("copy");ok()}catch(e){}
  }
};

applyLang();
setInterval(function(){
  if(busy)return;
  var any=false;
  for(var i=0;i<ids.length;i++){if(running(ids[i]))any=true}
  if(any||st.key)render();else{var all=isDone(1)&&isDone(2)&&isDone(3);$("getkey").disabled=!all}
},250);
document.addEventListener("visibilitychange",render);

var c=$("petals"),x=c.getContext("2d"),P=[],W=0,H=0;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener("resize",size);
function petal(init){return{x:Math.random()*W,y:init?Math.random()*H:-20,r:4+Math.random()*6,s:.4+Math.random()*.9,d:Math.random()*6.28,w:.6+Math.random()*1.2,a:.25+Math.random()*.4}}
for(var i=0;i<26;i++)P.push(petal(true));
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  (function loop(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];p.y+=p.s;p.d+=.02*p.w;p.x+=Math.sin(p.d)*.8;
      if(p.y>H+20)P[i]=petal(false);
      x.save();x.translate(p.x,p.y);x.rotate(p.d);x.globalAlpha=p.a;
      x.fillStyle="#ff9cc2";x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.283);x.fill();x.restore();
    }
    requestAnimationFrame(loop);
  })();
}
})();
</script>
</body>
</html>
